name: Lean, documentation and blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project and documentation
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build-args: Construction

      - name: Build API documentation
        run: lake -R -Kenv=dev build Construction:docs

      - name: Build blueprint and dependency graph
        uses: xu-cheng/texlive-action@v3
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20250401
          run: |
            apk add --no-cache make py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            python3 -m venv env
            . env/bin/activate
            pip install --upgrade pip wheel
            # Alpine stores Graphviz plugins outside the default linker search path.
            LDFLAGS="-L/usr/lib/graphviz -Wl,-rpath,/usr/lib/graphviz" \
              pip install leanblueprint==0.0.20
            leanblueprint web
            python3 scripts/update_dependency_graph.py
            leanblueprint pdf
            mkdir -p docs
            cp blueprint/print/print.pdf docs/blueprint.pdf
            cp -r blueprint/web docs/blueprint

      - name: Check blueprint declarations
        run: lake exe checkdecls blueprint/lean_decls

      - name: Collect API documentation
        run: |
          sudo chown -R runner docs
          cp -r .lake/build/doc docs/docs

      - name: Upload docs and blueprint
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build_project
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
